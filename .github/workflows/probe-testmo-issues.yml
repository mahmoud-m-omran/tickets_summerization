name: Probe Testmo Issues API

on:
  push:
    paths:
      - 'scripts/probe_testmo_issues.py'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe Testmo issues schema
        env:
          TESTMO_API_TOKEN: ${{ secrets.TESTMO_API_TOKEN }}
        run: python3 scripts/probe_testmo_issues.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe-results/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: probe results [skip ci]"
            git push origin HEAD:main
          fi

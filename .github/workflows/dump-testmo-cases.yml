name: Dump Testmo Cases

on:
  push:
    paths:
      - 'triggers-dumps/**'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dump Testmo cases for prior-art checking
        env:
          TESTMO_API_TOKEN: ${{ secrets.TESTMO_API_TOKEN }}
        run: python3 scripts/dump_testmo_cases.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A triggers-dumps/ completed-dumps/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: process case-dump triggers [skip ci]"
            git push origin HEAD:main
          fi

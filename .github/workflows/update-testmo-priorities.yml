name: Update Testmo Case Priorities

on:
  push:
    paths:
      - 'triggers-priorities/**'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update case priorities
        env:
          TESTMO_API_TOKEN: ${{ secrets.TESTMO_API_TOKEN }}
        run: python3 scripts/update_testmo_priorities.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A triggers-priorities/ completed-priorities/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: process priority triggers [skip ci]"
            git push origin HEAD:main
          fi

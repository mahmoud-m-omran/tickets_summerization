name: Link Testmo Cases to Jira Issues

on:
  push:
    paths:
      - 'triggers-links/*.json'
  workflow_dispatch:

jobs:
  link:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Link cases to issues
        env:
          TESTMO_API_TOKEN: ${{ secrets.TESTMO_API_TOKEN }}
        run: python3 scripts/link_testmo_issues.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A triggers-links/ completed-links/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: process link triggers [skip ci]"
            git push origin HEAD:main
          fi
